<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
  <title>Itinerary</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f4c5c'/%3E%3Cpath d='M20.5 15.5v-1.8l-7.5-4.7V4.4a1.3 1.3 0 0 0-2.6 0V9L3 13.7v1.8l7.4-2.3v4.5l-1.9 1.4v1.4l3.2-.9 3.2.9v-1.4l-1.9-1.4v-4.5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/trips.css">
  <script src="/js/trips.js" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-in">
      <a class="brand" href="/" aria-label="Itinerary home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M20.5 15.5v-1.8l-7.5-4.7V4.4a1.3 1.3 0 0 0-2.6 0V9L3 13.7v1.8l7.4-2.3v4.5l-1.9 1.4v1.4l3.2-.9 3.2.9v-1.4l-1.9-1.4v-4.5z"/></svg>
        </span>
        <span class="brand-name">Itinerary</span>
      </a>

      <nav class="nav" aria-label="Pages">
        <a class="nav-link" href="/" aria-current="page">Trips</a>
        <a class="nav-link" href="/departures">Departures</a>
      </nav>

      <div class="appbar-right">
        <span id="conn" class="conn-lost" role="status" hidden>Connection lost</span>
        <span class="updated">Updated <time id="updated">&mdash;</time></span>
        <label class="person">
          <span class="person-label">Traveller</span>
          <select id="person" aria-label="Traveller" disabled>
            <option>Loading&hellip;</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="page">
    <section id="list-section" hidden>
      <div class="list-head" aria-hidden="true">
        <span class="lh-trip">Trip</span>
        <span class="lh-date">Start</span>
        <span class="lh-date">End</span>
      </div>
      <div id="trips" class="trips"></div>
    </section>

    <section id="unassigned" class="unassigned" hidden>
      <h2 class="section-title">Bookings not in a trip</h2>
      <p class="section-sub">These records belong to the selected traveller but were not placed in any trip.</p>
      <div id="unassigned-body" class="unassigned-body"></div>
    </section>

    <section id="empty" class="empty" hidden>
      <p id="empty-title" class="empty-title">No trips yet</p>
      <p id="empty-sub" class="empty-sub"></p>
    </section>

    <p id="loading" class="loading" role="status">Loading itinerary&hellip;</p>
    <noscript><p class="loading">This page needs JavaScript to run.</p></noscript>
  </main>

  <footer class="foot">
    <span id="count"></span>
    <span id="sources" class="sources"></span>
  </footer>
</body>
</html>
