<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a13">
  <meta name="color-scheme" content="dark">
  <title>Departures</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23060a13'/%3E%3Cpath fill='%23ffb400' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z' transform='translate(1.5 0) scale(.88)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="plane" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      </span>
      <div class="brand-text">
        <h1>DEPARTURES</h1>
        <p class="tagline">FLIGHT INFORMATION &middot; LOCAL AIRPORT TIMES</p>
      </div>
    </div>

    <div class="meta">
      <div id="conn" class="conn-pill" role="status" hidden>CONNECTION LOST &ndash; retrying</div>
      <div class="clock">
        <time id="clock-time" class="clock-time">--:--:--</time>
        <span id="clock-date" class="clock-date">&nbsp;</span>
      </div>
      <div class="scan">
        <span class="scan-label">LAST SCAN</span>
        <time id="last-scan" class="scan-time">&mdash;</time>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="toolbar">
      <div id="filter" class="filter" hidden>
        <button type="button" id="filter-btn" class="filter-btn" aria-haspopup="true" aria-expanded="false" aria-controls="filter-panel">
          <span class="filter-label">PASSENGERS</span>
          <span id="filter-value" class="filter-value">ALL</span>
          <span class="caret" aria-hidden="true"></span>
        </button>
        <div id="filter-panel" class="filter-panel" role="group" aria-label="Filter by passenger" hidden></div>
      </div>
    </div>

    <table id="board" class="board" aria-label="Departures board">
      <thead>
        <tr>
          <th scope="col" class="h-airline">Airline</th>
          <th scope="col" class="h-flight">Flight</th>
          <th scope="col" class="h-date">Date</th>
          <th scope="col" class="h-depart">Departs</th>
          <th scope="col" class="h-from">From</th>
          <th scope="col" class="h-to">To</th>
          <th scope="col" class="h-arrive">Arrives</th>
          <th scope="col" class="h-class">Class</th>
          <th scope="col" class="h-pax">Passenger(s)</th>
          <th scope="col" class="h-pnr">PNR/Ref</th>
          <th scope="col" class="h-notes">Notes</th>
        </tr>
      </thead>
    </table>

    <section id="empty" class="empty" hidden aria-live="polite">
      <div class="empty-board">
        <span class="empty-plane" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
        </span>
        <div id="empty-l1" class="flaps flaps-xl" role="text"></div>
        <div id="empty-l2" class="flaps flaps-xl amber" role="text"></div>
        <p class="empty-sub">The board updates automatically &mdash; check back soon.</p>
      </div>
    </section>

    <p id="loading" class="loading" role="status">LOADING BOARD&hellip;</p>
    <noscript><p class="loading">This departure board needs JavaScript to run.</p></noscript>
  </main>

  <footer class="foot">
    <span id="count">&nbsp;</span>
    <span class="foot-sep" aria-hidden="true">&#9670;</span>
    <span>ALL TIMES ARE LOCAL TO EACH AIRPORT</span>
  </footer>
</body>
</html>
